<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mineradio Overlay</title>
  <style>
    :root { --accent: #f4d28a; --bg: rgba(6,8,14,.72); --text: rgba(255,255,255,.88); --muted: rgba(255,255,255,.46); }
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none;font-family:Inter,"Segoe UI",sans-serif}
    body{opacity:0;transition:opacity .2s ease}
    body.show{opacity:1}
    .bar{
      display:flex;align-items:center;gap:12px;
      padding:10px 18px;margin:8px;height:42px;
      border-radius:14px;
      background:var(--bg);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(28px) saturate(1.2);
      -webkit-backdrop-filter:blur(28px) saturate(1.2);
      box-shadow:0 8px 32px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.06);
      color:var(--text);font-size:13px;font-weight:600;
      max-width:calc(100vw - 16px);overflow:hidden
    }
    .art{width:34px;height:34px;border-radius:7px;flex:0 0 auto;background:rgba(255,255,255,.06);background-size:cover;background-position:center}
    .info{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
    .title{font-size:12.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis}
    .artist{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
    .ctrls{display:flex;align-items:center;gap:6px;flex:0 0 auto}
    .ctrls button{
      width:28px;height:28px;border:0;border-radius:50%;
      background:rgba(255,255,255,.07);color:rgba(255,255,255,.72);
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:background .15s,color .15s;font-size:0
    }
    .ctrls button:hover{background:rgba(255,255,255,.14);color:#fff}
    .ctrls button svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .play{background:rgba(244,210,138,.16);color:var(--accent)}
    .play:hover{background:rgba(244,210,138,.28);color:#fff}
    .progress{position:absolute;bottom:0;left:18px;right:18px;height:2px;background:rgba(255,255,255,.08);border-radius:1px;overflow:hidden}
    .progress-fill{height:100%;background:var(--accent);transition:width .4s linear;border-radius:1px}
    .close{position:absolute;top:6px;right:8px;width:20px;height:20px;border:0;background:none;color:rgba(255,255,255,.35);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
    .close:hover{color:#fff}
  </style>
</head>
<body>
  <div class="bar">
    <div class="art" id="art"></div>
    <div class="info"><div class="title" id="title">Mineradio</div><div class="artist" id="artist"></div></div>
    <div class="ctrls">
      <button id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8z"/><line x1="5" y1="4" x2="5" y2="20"/></svg></button>
      <button id="play" class="play" title="Play / Pause"><svg id="playIcon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg></button>
      <button id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8z"/><line x1="19" y1="4" x2="19" y2="20"/></svg></button>
    </div>
    <button class="close" id="close" title="Close overlay">&times;</button>
    <div class="progress"><div class="progress-fill" id="prog"></div></div>
  </div>
  <script>
    'use strict';
    var title=document.getElementById('title'),artist=document.getElementById('artist'),
        art=document.getElementById('art'),prog=document.getElementById('prog'),
        playIcon=document.getElementById('playIcon'),playing=false;
    document.getElementById('play').onclick=function(){if(window.desktopOverlay)window.desktopOverlay.togglePlay()};
    document.getElementById('prev').onclick=function(){if(window.desktopOverlay)window.desktopOverlay.prevTrack()};
    document.getElementById('next').onclick=function(){if(window.desktopOverlay)window.desktopOverlay.nextTrack()};
    document.getElementById('close').onclick=function(){if(window.desktopOverlay)window.desktopOverlay.closeOverlay()};
    function applyState(s){
      if(!s)return;
      var cfg=s.config||{};
      var pos=cfg.barPosition||'top-right';
      var bar=document.querySelector('.bar');
      bar.style.left='';bar.style.right='';bar.style.top='';bar.style.bottom='';
      if(pos.indexOf('left')>=0)bar.style.left='8px';else bar.style.right='8px';
      if(pos.indexOf('top')>=0)bar.style.top='8px';else bar.style.bottom='8px';
      document.body.style.opacity=(cfg.barOpacity!=null?cfg.barOpacity:.92);
      art.style.display=cfg.showArt===false?'none':'';
      artist.parentElement.style.display=(cfg.showArtist===false)?'none':'';
      document.querySelector('.progress').style.display=cfg.showProgress===false?'none':'';
      title.textContent=s.title||'Mineradio';
      artist.textContent=s.artist||'';
      art.style.backgroundImage=s.art?'url("'+s.art+'")':'';
      playing=!!s.playing;
      playIcon.innerHTML=playing?'<line x1="6" y1="4" x2="6" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/>':'<polygon points="6,3 20,12 6,21"/>';
      prog.style.width=(s.duration>0?(s.position/s.duration*100):0)+'%';
      document.body.classList.toggle('show',s.enabled!==false);
    }
    if(window.desktopOverlay&&window.desktopOverlay.onOverlayState){window.desktopOverlay.onOverlayState(applyState)}
    window.addEventListener('message',function(e){if(e.data&&e.data.type==='mineradio-overlay-state')applyState(e.data.payload||{})});
  </script>
</body>
</html>
