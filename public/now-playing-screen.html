<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mineradio — Now Playing</title>
  <style>
    :root { --accent:#f4d28a; }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#eef1f7;
      font-family:Inter,"Segoe UI",sans-serif;user-select:none;display:flex;align-items:center;justify-content:center}
    .bgart{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(70px) brightness(.34) saturate(1.4);transform:scale(1.15);transition:background-image .6s ease;z-index:0}
    .card{position:relative;z-index:1;text-align:center;max-width:min(720px,88vw);padding:40px}
    .art{width:min(340px,58vw);aspect-ratio:1;border-radius:22px;margin:0 auto 30px;
      background:rgba(255,255,255,.05) center/cover no-repeat;
      box-shadow:0 32px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.08)}
    .title{font-size:clamp(22px,3.4vw,38px);font-weight:800;line-height:1.16;letter-spacing:.01em}
    .artist{margin-top:8px;font-size:clamp(14px,1.8vw,20px);color:rgba(255,255,255,.52);font-weight:500}
    .progress{margin:30px auto 0;width:min(460px,80vw);height:4px;background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden}
    .progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .5s linear}
    .times{margin-top:10px;font-size:12px;color:rgba(255,255,255,.38);display:flex;justify-content:space-between;width:min(460px,80vw);margin-left:auto;margin-right:auto}
    .lyric{margin-top:26px;min-height:2.6em;font-size:clamp(14px,1.9vw,21px);font-weight:600;color:rgba(244,210,138,.9);
      text-shadow:0 0 18px rgba(244,210,138,.25);line-height:1.35}
    .paused-badge{display:inline-block;margin-top:18px;padding:5px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);
      visibility:hidden}
    body.paused .paused-badge{visibility:visible}
    .close-hint{position:fixed;top:18px;right:22px;z-index:2;display:flex;align-items:center;gap:10px;
      opacity:.35;transition:opacity .2s ease}
    .close-hint:hover{opacity:1}
    .close-hint span{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.06em}
    .close-hint button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
      background:rgba(8,10,16,.72);color:rgba(255,255,255,.82);font-size:15px;line-height:1;cursor:pointer;
      display:flex;align-items:center;justify-content:center}
    .close-hint button:hover{background:rgba(255,83,103,.25);border-color:rgba(255,83,103,.5);color:#fff}
    @media (max-width:520px){.art{width:72vw}.card{padding:20px}}
  </style>
</head>
<body>
  <div class="bgart" id="bg"></div>
  <div class="close-hint"><span>Esc to close</span><button id="closeScreen" title="Close second screen">&times;</button></div>
  <div class="card">
    <div class="art" id="art"></div>
    <div class="title" id="title">Mineradio</div>
    <div class="artist" id="artist">Nothing playing yet</div>
    <div class="progress"><div class="progress-fill" id="prog" style="width:0%"></div></div>
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="lyric" id="lyric"></div>
    <div class="paused-badge">Paused</div>
  </div>
  <script>
    'use strict';
    function fmt(t){t=Math.max(0,t|0);return (t/60|0)+':'+String(t%60).padStart(2,'0')}
    var lastKey='';
    function applyState(s){
      if(!s)return;
      var key=(s.title||'')+'|'+(s.artist||'')+'|'+(s.art||'');
      document.getElementById('title').textContent=s.title||'Mineradio';
      document.getElementById('artist').textContent=s.artist||'Nothing playing yet';
      if(s.art){
        document.getElementById('art').style.backgroundImage='url("'+s.art+'")';
        if(key!==lastKey){document.getElementById('bg').style.backgroundImage='url("'+s.art+'")';}
      }
      lastKey=key;
      document.body.classList.toggle('paused',!s.playing);
      var dur=s.duration>0?s.duration:0,pos=Math.min(s.position||0,dur||s.position||0);
      document.getElementById('prog').style.width=(dur>0?(pos/dur*100):0)+'%';
      document.getElementById('tCur').textContent=fmt(pos);
      document.getElementById('tDur').textContent=fmt(dur);
      document.getElementById('lyric').textContent=s.lyric||'';
    }
    if(window.desktopOverlay&&window.desktopOverlay.onOverlayState){window.desktopOverlay.onOverlayState(applyState)}
    window.addEventListener('message',function(e){if(e.data&&e.data.type==='mineradio-overlay-state')applyState(e.data.payload||{})});
    document.getElementById('closeScreen').onclick=function(){if(window.desktopOverlay)window.desktopOverlay.closeScreen()};
    window.addEventListener('keydown',function(e){if(e.key==='Escape'){if(window.desktopOverlay)window.desktopOverlay.closeScreen()}});
  </script>
</body>
</html>
